services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wohnungsvergabe}:${POSTGRES_PASSWORD:-wohnungsvergabe_dev_password}@db:5432/${POSTGRES_DB:-wohnungsvergabe}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wohnungsvergabe}
      POSTGRES_USER: ${POSTGRES_USER:-wohnungsvergabe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wohnungsvergabe_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
