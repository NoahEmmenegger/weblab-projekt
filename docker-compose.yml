services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVER_ACTION_ALLOWED_ORIGINS: ${SERVER_ACTION_ALLOWED_ORIGINS:-}
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wohnungsvergabe}:${POSTGRES_PASSWORD:-wohnungsvergabe_dev_password}@db:5432/${POSTGRES_DB:-wohnungsvergabe}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wohnungsvergabe}:${POSTGRES_PASSWORD:-wohnungsvergabe_dev_password}@db:5432/${POSTGRES_DB:-wohnungsvergabe}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wohnungsvergabe}
      POSTGRES_USER: ${POSTGRES_USER:-wohnungsvergabe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
