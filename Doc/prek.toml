[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
    { id = "end-of-file-fixer", exclude = { glob = [
        "*.lock",
        "*.drawio",
        "LICENSE",
        ".gitignore",
        "*.svg",
        "*.png",
        "*.jpg",
        "*.pdf",
    ] } },
    { id = "trailing-whitespace", args = [
        "--markdown-linebreak-ext=md",
    ] },
]

[[repos]]
repo = "https://github.com/typstyle-rs/pre-commit-typstyle"
rev = "v0.14.4"
hooks = [{ id = "typstyle" }]
